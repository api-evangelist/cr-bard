aid: cr-bard
name: C. R. Bard
kind: company
description: >-
  C. R. Bard, Inc. was an American multinational developer, manufacturer, and
  marketer of medical technologies in the fields of vascular, urology, oncology,
  and surgical specialties. Bard was founded in 1907 by Charles Russell Bard and
  was acquired by Becton, Dickinson and Company (BD) in December 2017 for
  approximately $24 billion. Bard's product lines now operate as part of BD's
  Interventional segment under the BD Bard brand. No public API or developer
  portal is published; integrations with hospital and provider systems are
  arranged through BD enterprise channels.
